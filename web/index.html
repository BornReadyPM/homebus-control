<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f6f2">
  <title>Grasshopper Home</title>
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">g</span><div><strong>Grasshopper</strong><small>Home controls</small></div></div>
    <div class="top-actions"><span id="gateway" class="connection"><i></i><span>Connecting</span></span><a class="icon-link" href="/setup" aria-label="Settings">⚙</a></div>
  </header>
  <main class="page-wrap">
    <div class="global-actions" role="group" aria-label="Whole-home light controls">
      <button id="all-lights-off" class="global-action global-action-off" type="button">All OFF</button>
      <button id="all-lights-on" class="global-action global-action-on" type="button" disabled>All ON</button>
    </div>
    <div id="rooms" class="rooms"><div class="loading-card">Loading your rooms…</div></div>
    <p id="message" class="toast" role="status"></p>
    <footer><span id="updated">Waiting for gateway status</span><button id="refresh" class="text-button">Refresh</button></footer>
  </main>
  <script src="/assets/app.js" defer></script>
</body>
</html>
